# Pack-check: prove the CI can BUILD + PACK the shipped NuGet packages, with NO publish.
# Unlike publish.yml (tag-triggered, pushes to nuget.org), this never pushes anywhere — it packs the
# packages and uploads them as a build artifact only. The adoption-first design
# (docs/SUMOSHARP-PACKAGING-DESIGN.md §V2) ships exactly TWO packages: the portable `SumoSharp` engine
# bundle and the optional native `SumoSharp.Dds` transport (which restores CycloneDDS.NET on the
# runner — the part that proves CI can build the native binding). The viewers are repo-built apps, not
# packages, so they are not packed here.
name: pack-check

on:
  workflow_dispatch: {}
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "packaging/**"
      - "tests/**"
      - "Directory.Build.props"
      - "Traffic.sln" # a solution change can break the restore/build gate (see the V2-collapse fix)
      - ".github/workflows/pack-check.yml"

jobs:
  pack-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so SourceLink can pin the commit

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Traffic.sln

      - name: Build (Release)
        run: dotnet build Traffic.sln -c Release --no-restore

      # Never pack a red build: keep the hermetic parity gate as a precondition.
      - name: Test (offline parity gate)
        run: dotnet test Traffic.sln -c Release --no-build

      - name: Pack the shipped packages (NO publish)
        run: |
          echo "packing at Directory.Build.props version (no tag override — this is a build check)"
          # Neither the bundle nor the DDS binding is in Traffic.sln (the bundle references the portable
          # engine projects; the DDS binding restores CycloneDDS.NET), so build+pack them standalone.
          # The bundle emits the portable engine assemblies (Core..LiveCity) into ONE SumoSharp package;
          # SumoSharp.Dds packs its own assembly and depends on the SumoSharp package.
          dotnet pack packaging/SumoSharp/SumoSharp.csproj            -c Release -o ./nupkgs
          dotnet pack src/Sim.Replication.Dds/Sim.Replication.Dds.csproj -c Release -o ./nupkgs
          echo "=== packed ==="
          ls -l ./nupkgs

      - name: Assert exactly the 2 shipped packages were produced
        run: |
          count="$(ls ./nupkgs/*.nupkg 2>/dev/null | wc -l)"
          echo "nupkg count: $count"
          for id in SumoSharp SumoSharp.Dds ; do
            ls ./nupkgs/${id}.*.nupkg >/dev/null 2>&1 || { echo "::error::missing package $id"; exit 1; }
          done
          # Exactly two, no more: catches an internal engine project accidentally re-acquiring a PackageId.
          if [ "$count" -ne 2 ]; then
            echo "::error::expected exactly 2 nupkgs (SumoSharp, SumoSharp.Dds), got $count"; exit 1
          fi
          echo "both shipped packages packed OK"

      - name: Upload packages as build artifact (not published)
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*
