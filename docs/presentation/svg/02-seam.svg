<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="560" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The seam SUMO does not have</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >SUMO has no concept of an agent it does not control. Cars here react to injected agents.</text><rect x="70" y="130" width="530" height="380" rx="12" fill="#243040" stroke="#52606D" stroke-width="1.2" opacity="1.0"/><text x="96" y="168" font-size="20" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Stock SUMO</text><text x="96" y="192" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A closed world: only what SUMO spawns exists.</text><rect x="96" y="250" width="478" height="86" fill="#1a222c"/><line x1="96" y1="293" x2="574" y2="293" stroke="#F0B429" stroke-width="2" stroke-dasharray="14 12" opacity="0.5"/><g transform="translate(160,271) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><g transform="translate(290,271) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><g transform="translate(420,271) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><text x="96" y="380" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Pedestrians, crowds, live detections:</text><text x="96" y="400" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >not representable. Cars cannot react</text><text x="96" y="420" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >to what the model cannot express.</text><circle cx="320" cy="293" r="8" fill="none" stroke="#E5534B" stroke-width="2"/><line x1="314" y1="287" x2="326" y2="299" stroke="#E5534B" stroke-width="2"/><line x1="326" y1="287" x2="314" y2="299" stroke="#E5534B" stroke-width="2"/><rect x="680" y="130" width="530" height="380" rx="12" fill="#243040" stroke="#52606D" stroke-width="1.2" opacity="1.0"/><text x="706" y="168" font-size="20" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >SumoSharp</text><text x="706" y="192" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Anything can be injected. Cars respond.</text><rect x="706" y="250" width="478" height="86" fill="#1a222c"/><line x1="706" y1="293" x2="1184" y2="293" stroke="#F0B429" stroke-width="2" stroke-dasharray="14 12" opacity="0.5"/><g transform="translate(770,271) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><g transform="translate(900,271) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><g transform="translate(1030,271) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><circle cx="930" cy="293" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="942" cy="306" r="7" fill="#2BB3A3" opacity="1.0"/><text x="916" y="340" font-size="12" fill="#2BB3A3" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >injected agent</text><line x1="900" y1="271" x2="880" y2="271" stroke="#F0B429" stroke-width="2.4"  marker-end="url(#ah-F0B429)"/><text x="706" y="380" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Cars brake, treat it as a leader, veto a lane change,</text><text x="706" y="400" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >swerve in-lane, spill to a safe lane — then resume.</text><text x="706" y="436" font-size="13" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Frozen once per step ⇒ order-independent,</text><text x="706" y="456" font-size="13" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >so it survives parallel execution.</text><text x="706" y="488" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Handle-based, generation-validated: a stale</text><text x="706" y="504" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >handle is an inert no-op, never a wrong write.</text></svg>