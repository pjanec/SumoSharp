<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="570" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Two-level pedestrian LOD</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Cost follows attention. The cheap level is a closed-form pose, not a simplified solver.</text><rect x="70" y="130" width="540" height="400" rx="12" fill="#243040" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><text x="96" y="168" font-size="18" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >LOW POWER</text><text x="96" y="192" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >pose = f(route, seed, width, time)</text><text x="96" y="224" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >O(1) per pedestrian. Zero neighbour queries.</text><text x="96" y="246" font-size="15" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Spreads and weaves — never a single file.</text><text x="96" y="268" font-size="14" fill="#F0B429" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Believable, not collision-free.</text><text x="96" y="296" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Closed form ⇒ any number of observers</text><text x="96" y="314" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >reconstruct the identical pose independently.</text><circle cx="120" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="172" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="224" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="276" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="328" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="380" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="432" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="484" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><circle cx="536" cy="360" r="7" fill="#2BB3A3" opacity="0.85"/><text x="96" y="404" font-size="14" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Thousands of them cost what tens would.</text><rect x="96" y="428" width="488" height="76" rx="8" fill="#1a222c" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="116" y="456" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The trade, on purpose</text><text x="116" y="478" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Performance bought with believability, not with correctness.</text><rect x="670" y="130" width="540" height="400" rx="12" fill="#243040" stroke="#6FE3D2" stroke-width="1.4" opacity="1.0"/><text x="696" y="168" font-size="18" fill="#6FE3D2" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >HIGH POWER</text><text x="696" y="192" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >full ORCA reciprocal avoidance</text><text x="696" y="224" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A real agent in a persistent crowd solver.</text><text x="696" y="246" font-size="15" fill="#6FE3D2" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >ASSURED avoidance — negotiated, not styled.</text><text x="696" y="278" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >This is the level cars can see and yield to.</text><circle cx="760" cy="350" r="12.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="760" cy="350" r="9" fill="#6FE3D2"/><circle cx="800" cy="372" r="12.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="800" cy="372" r="9" fill="#6FE3D2"/><circle cx="845" cy="344" r="12.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="845" cy="344" r="9" fill="#6FE3D2"/><circle cx="890" cy="366" r="12.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="890" cy="366" r="9" fill="#6FE3D2"/><circle cx="935" cy="340" r="12.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="935" cy="340" r="9" fill="#6FE3D2"/><circle cx="975" cy="368" r="12.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="975" cy="368" r="9" fill="#6FE3D2"/><circle cx="1020" cy="348" r="12.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="1020" cy="348" r="9" fill="#6FE3D2"/><line x1="760" y1="350" x2="800" y2="372" stroke="#6FE3D2" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/><line x1="800" y1="372" x2="845" y2="344" stroke="#6FE3D2" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/><line x1="845" y1="344" x2="890" y2="366" stroke="#6FE3D2" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/><line x1="890" y1="366" x2="935" y2="340" stroke="#6FE3D2" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/><line x1="935" y1="340" x2="975" y2="368" stroke="#6FE3D2" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/><line x1="975" y1="368" x2="1020" y2="348" stroke="#6FE3D2" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/><text x="696" y="404" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Promoted only where fidelity is observed.</text><rect x="696" y="428" width="488" height="76" rx="8" fill="#1a222c" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="716" y="456" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The guarantee</text><text x="716" y="478" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Promote wherever avoidance must actually hold.</text></svg>