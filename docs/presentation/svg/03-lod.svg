<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="600" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Two-level pedestrian LOD</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The cheap level exists to look ORGANIC, not merely to be cheap — uniform, rail-like crowds are the thing it removes.</text><rect x="70" y="130" width="540" height="430" rx="12" fill="#243040" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><text x="96" y="168" font-size="18" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >LOW POWER</text><text x="96" y="192" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >pose = f(route, seed, width, time)</text><text x="96" y="224" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Weaves and spreads across the walkable width.</text><text x="96" y="246" font-size="15" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Keeps its own side, scatters within it.</text><text x="96" y="274" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >O(1) per pedestrian, zero neighbour queries.</text><rect x="96" y="300" width="488" height="118" rx="6" fill="#1a222c"/><line x1="96" y1="359" x2="584" y2="359" stroke="#52606D" stroke-width="1" stroke-dasharray="6 8" opacity="0.5"/><circle cx="371.86920000000003" cy="338.75908" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="283.063" cy="350.710708" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="239.9194" cy="342.942688" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="160.1358" cy="338.439748" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="446.2484" cy="322.473148" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="177.2192" cy="345.152896" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="223.4314" cy="323.06158" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="161.8304" cy="337.280824" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="458.706" cy="350.466724" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="568.168" cy="341.478784" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="506.97920000000005" cy="324.270736" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="443.4088" cy="327.446116" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="409.8832" cy="320.668384" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="415.3334" cy="340.434676" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="400.998" cy="321.992356" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="242.7132" cy="341.712004" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="240.5148" cy="337.618096" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="268.31539999999995" cy="334.729756" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="115.8014" cy="323.352208" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="258.9264" cy="321.174292" r="7" fill="#2BB3A3" opacity="0.93"/><circle cx="420.2798" cy="386.818776" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="207.9052" cy="390.6687" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="132.381" cy="387.346212" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="169.6622" cy="389.75376" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="249.4458" cy="370.489788" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="246.1482" cy="376.130124" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="423.9896" cy="383.54652" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="440.844" cy="397.546896" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="446.93539999999996" cy="393.140832" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="469.1942" cy="384.813084" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="550.4892" cy="380.719176" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="310.5888" cy="394.802076" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="341.5954" cy="398.278848" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="515.8186000000001" cy="381.978564" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="531.6654" cy="396.37362" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="484.583" cy="399.775044" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="361.2894" cy="368.509212" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="438.69140000000004" cy="393.696972" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="485.499" cy="372.301728" r="7" fill="#7FD8CE" opacity="0.93"/><circle cx="435.1648" cy="367.11348" r="7" fill="#7FD8CE" opacity="0.93"/><text x="96" y="440" font-size="14" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >No grid. No rails. No convoy.</text><rect x="96" y="458" width="488" height="86" rx="8" fill="#2e2a22" stroke="#F0B429" stroke-width="1.2" opacity="1.0"/><text x="116" y="486" font-size="13" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Honest bound</text><text x="116" y="508" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >At high density roughly 15% can still overlap —</text><text x="116" y="528" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >believable, not collision-free. That is the trade.</text><rect x="670" y="130" width="540" height="430" rx="12" fill="#243040" stroke="#6FE3D2" stroke-width="1.4" opacity="1.0"/><text x="696" y="168" font-size="18" fill="#6FE3D2" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >HIGH POWER</text><text x="696" y="192" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >full ORCA reciprocal avoidance</text><text x="696" y="224" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A real agent in a persistent crowd solver.</text><text x="696" y="246" font-size="15" fill="#6FE3D2" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Never overlaps. Avoidance is assured.</text><text x="696" y="274" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The level cars can see and yield to.</text><rect x="696" y="300" width="488" height="118" rx="6" fill="#1a222c"/><circle cx="972.002249920904" cy="359.0" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="972.002249920904" cy="359.0" r="7" fill="#6FE3D2"/><circle cx="895.853188892692" cy="367.7917598392292" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="895.853188892692" cy="367.7917598392292" r="7" fill="#6FE3D2"/><circle cx="946.8532311697626" cy="342.02412305533676" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="946.8532311697626" cy="342.02412305533676" r="7" fill="#6FE3D2"/><circle cx="996.7684347185183" cy="375.0966023073707" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="996.7684347185183" cy="375.0966023073707" r="7" fill="#6FE3D2"/><circle cx="835.4830469293636" cy="354.980961418853" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="835.4830469293636" cy="354.980961418853" r="7" fill="#6FE3D2"/><circle cx="1039.2119323119364" cy="345.28032388811886" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="1039.2119323119364" cy="345.28032388811886" r="7" fill="#6FE3D2"/><circle cx="906.7683124147361" cy="385.8739609991583" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="906.7683124147361" cy="385.8739609991583" r="7" fill="#6FE3D2"/><circle cx="876.5575855964756" cy="332.444671969317" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="876.5575855964756" cy="332.444671969317" r="7" fill="#6FE3D2"/><circle cx="1077.7540348532023" cy="369.9364245496932" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="1077.7540348532023" cy="369.9364245496932" r="7" fill="#6FE3D2"/><circle cx="796.6001154333561" cy="371.86812768534463" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="796.6001154333561" cy="371.86812768534463" r="7" fill="#6FE3D2"/><circle cx="1009.16323091209" cy="326.87004215082976" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="1009.16323091209" cy="326.87004215082976" r="7" fill="#6FE3D2"/><circle cx="991.1312301429243" cy="394.43791750874857" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="991.1312301429243" cy="394.43791750874857" r="7" fill="#6FE3D2"/><circle cx="785.8358132851009" cy="339.5779786880982" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="785.8358132851009" cy="339.5779786880982" r="7" fill="#6FE3D2"/><circle cx="1120.9061501613867" cy="350.35397631253284" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="1120.9061501613867" cy="350.35397631253284" r="7" fill="#6FE3D2"/><circle cx="829.5673850340992" cy="393.1476151385416" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="829.5673850340992" cy="393.1476151385416" r="7" fill="#6FE3D2"/><circle cx="914.4817952150726" cy="316.1908192581101" r="10.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="914.4817952150726" cy="316.1908192581101" r="7" fill="#6FE3D2"/><text x="696" y="440" font-size="14" fill="#6FE3D2" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Negotiated every step, so nobody interpenetrates.</text><rect x="696" y="458" width="488" height="86" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="716" y="486" font-size="13" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The guarantee</text><text x="716" y="508" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Promote wherever avoidance must actually hold —</text><text x="716" y="528" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >the camera zone, an incident, anywhere you choose.</text></svg>