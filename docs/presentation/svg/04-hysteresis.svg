<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="540" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Why promotion needs two radii and a dwell</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >One shared radius makes a pedestrian standing on it flip level every single step.</text><circle cx="340" cy="330" r="160" fill="#C7A4FF" opacity="0.09"/><circle cx="340" cy="330" r="160" fill="none" stroke="#C7A4FF" stroke-width="1.6" stroke-dasharray="7 6"/><circle cx="340" cy="330" r="90" fill="#C7A4FF" opacity="0.16"/><circle cx="340" cy="330" r="90" fill="none" stroke="#C7A4FF" stroke-width="2"/><circle cx="340" cy="330" r="9" fill="#F5F7FA"/><text x="340" y="362" font-size="12" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >interest source</text><text x="340" y="230" font-size="13" fill="#C7A4FF" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >promote</text><text x="340" y="160" font-size="13" fill="#C7A4FF" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >demote</text><circle cx="285" cy="385" r="11.5" fill="none" stroke="#F5F7FA" stroke-width="1.3" opacity="0.55"/><circle cx="285" cy="385" r="8" fill="#6FE3D2"/><circle cx="460" cy="270" r="7" fill="#2BB3A3" opacity="1.0"/><circle cx="550" cy="360" r="7" fill="#2BB3A3" opacity="1.0"/><line x1="545" y1="350" x2="470" y2="300" stroke="#9AA5B1" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ah-9AA5B1)"/><text x="700" y="168" font-size="18" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Spatial hysteresis</text><text x="700" y="194" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Promote inside the inner radius; demote only once</text><text x="700" y="214" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >continuously outside the LARGER one. The gap between</text><text x="700" y="234" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >them is what stops the oscillation.</text><text x="700" y="282" font-size="18" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Temporal hysteresis</text><text x="700" y="308" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A dwell time floors how fast a level may change at all,</text><text x="700" y="328" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >so a pedestrian loitering at the boundary is stable.</text><rect x="700" y="366" width="500" height="92" rx="8" fill="#2e2226" stroke="#E5534B" stroke-width="1.2" opacity="1.0"/><text x="720" y="394" font-size="14" fill="#E5534B" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Without both:</text><text x="720" y="416" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >promote / demote / promote every step — the ped</text><text x="720" y="436" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >visibly pops between motion models on screen.</text></svg>