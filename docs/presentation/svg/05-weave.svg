<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1026" viewBox="0 0 1280 1026" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="1026" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The deterministic weave</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Opposing flows are kept apart by construction — at O(1) per pedestrian, no neighbour queries.</text><text x="70" y="156" font-size="18" fill="#E5534B" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Uniform — the artefact</text><text x="410" y="156" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Evenly spaced, all on the centreline. This is what reads as rails.</text><rect x="70" y="174" width="1030" height="112" rx="6" fill="#1a222c"/><line x1="70" y1="230" x2="1100" y2="230" stroke="#52606D" stroke-width="1" stroke-dasharray="6 8" opacity="0.7"/><text x="1112" y="184" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pavement edge</text><text x="1112" y="234" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >centreline</text><circle cx="108" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="134" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="178" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="204" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="248" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="274" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="318" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="344" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="388" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="414" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="458" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="484" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="528" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="554" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="598" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="624" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="668" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="694" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="738" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="764" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="808" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="834" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="878" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="904" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="948" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="974" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="1018" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="1044" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><text x="70" y="356" font-size="18" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Weave — what we do instead</text><text x="410" y="356" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Each ped keeps its own half and scatters within it. Same O(1) cost.</text><rect x="70" y="374" width="1030" height="112" rx="6" fill="#1a222c"/><line x1="70" y1="430" x2="1100" y2="430" stroke="#52606D" stroke-width="1" stroke-dasharray="6 8" opacity="0.7"/><text x="1112" y="384" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pavement edge</text><text x="1112" y="434" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >centreline</text><circle cx="994.739" cy="403.3668" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="844.1768000000001" cy="408.90168" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="100.437" cy="421.99944" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="178.824" cy="395.80704000000003" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="857.9808" cy="396.44664" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="814.9911999999999" cy="409.89384" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="813.7094" cy="415.48176" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="167.978" cy="395.81328" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="1054.2934" cy="416.86392" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="223.687" cy="404.8956" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="954.6088" cy="410.0904" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="609.3116" cy="412.04664" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="612.0724" cy="408.75192" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="190.3602" cy="394.11288" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="717.18" cy="412.71432" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="231.47639999999998" cy="420.4956" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="932.0294" cy="402.76776" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="915.366" cy="416.72976" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="106.1558" cy="393.3516" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="943.2697999999999" cy="409.03272" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="886.279" cy="418.32408" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="797.4404000000001" cy="414.14016" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="957.764" cy="418.34592" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="906.6892" cy="423.4284" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="806.2158000000001" cy="404.85816" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="360.3466" cy="410.20584" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="214.813" cy="422.95104" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="418.5206" cy="413.8656" r="8" fill="#2BB3A3" opacity="0.93"/><circle cx="916.352" cy="455.1668" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="712.25" cy="438.3188" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="339.34479999999996" cy="463.63448" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="505.19" cy="459.34136" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="262.0424" cy="444.19376" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="165.11860000000001" cy="457.11056" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="226.645" cy="464.31776" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="480.44140000000004" cy="439.75712" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="464.66540000000003" cy="453.51008" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="602.0152" cy="458.53016" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="639.6804" cy="450.84248" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="895.3502" cy="442.33424" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="678.6274" cy="464.14616" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="178.6268" cy="447.6164" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="295.665" cy="459.15728" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="940.6076" cy="463.47848" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="548.9684" cy="459.97784" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="216.8836" cy="464.00576" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="166.499" cy="440.2844" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="397.0258" cy="451.82528" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="690.9524" cy="437.26112" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="518.2052000000001" cy="455.12936" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="421.0842" cy="452.38688" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="709.4892" cy="462.2804" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="476.596" cy="467.18192" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="195.7832" cy="465.87152000000003" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="316.1738" cy="460.3148" r="8" fill="#7FD8CE" opacity="0.93"/><circle cx="898.4068" cy="440.13464" r="8" fill="#7FD8CE" opacity="0.93"/><line x1="120" y1="384" x2="300" y2="384" stroke="#2BB3A3" stroke-width="2"  marker-end="url(#ah-2BB3A3)"/><text x="310" y="389" font-size="11" fill="#2BB3A3" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >eastbound</text><line x1="1060" y1="476" x2="880" y2="476" stroke="#7FD8CE" stroke-width="2"  marker-end="url(#ah-7FD8CE)"/><text x="870" y="481" font-size="11" fill="#7FD8CE" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >westbound</text><text x="70" y="536" font-size="17" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >And where they stop, not only where they walk</text><text x="70" y="560" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Waiting at a red crossing is the case a viewer notices first.</text><rect x="70" y="578" width="555" height="168" rx="10" fill="#1a222c" stroke="#E5534B" stroke-width="1.3" opacity="1.0"/><text x="94" y="606" font-size="15" fill="#E5534B" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >One waiting vertex</text><line x1="94" y1="712" x2="600" y2="712" stroke="#52606D" stroke-width="2"/><text x="94" y="736" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >kerb</text><rect x="320" y="620" width="58" height="92" fill="#F5F7FA" opacity="0.05"/><text x="349" y="636" font-size="10" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >crossing</text><circle cx="347" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><text x="400" y="690" font-size="12" fill="#E5534B" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >23 peds on one point</text><rect x="655" y="578" width="555" height="168" rx="10" fill="#1a222c" stroke="#57A773" stroke-width="1.3" opacity="1.0"/><text x="679" y="606" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Seeded waiting spread</text><line x1="679" y1="712" x2="1185" y2="712" stroke="#52606D" stroke-width="2"/><text x="679" y="736" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >kerb</text><rect x="905" y="620" width="58" height="92" fill="#F5F7FA" opacity="0.05"/><text x="934" y="636" font-size="10" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >crossing</text><circle cx="882" cy="688" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="900" cy="698" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="916" cy="684" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="930" cy="696" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="946" cy="688" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="962" cy="700" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="980" cy="690" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="890" cy="708" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="908" cy="712" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="926" cy="710" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="944" cy="714" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="964" cy="710" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="982" cy="706" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="996" cy="694" r="7" fill="#2BB3A3" opacity="0.95"/><text x="1013" y="690" font-size="12" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >busiest 0.5 m cell: 2.5%</text><rect x="70" y="764" width="1140" height="74" rx="10" fill="#243040" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="94" y="792" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Both are the same mechanism: a per-pedestrian seeded offset, evaluated not solved.</text><text x="94" y="816" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >No neighbour lookups, no iteration, no shared state — every observer derives the identical offset independently.</text><text x="70" y="872" font-size="17" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >What it guarantees, and what it does not</text><rect x="70" y="892" width="555" height="104" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="94" y="922" font-size="14" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Opposing flows: guaranteed, by construction</text><text x="94" y="946" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The keep-right offset puts east and west on provably</text><text x="94" y="966" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >different halves. They cannot cross into each other.</text><rect x="655" y="892" width="555" height="104" rx="8" fill="#2e2a22" stroke="#F0B429" stroke-width="1.2" opacity="1.0"/><text x="679" y="922" font-size="14" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Same direction: they can still overlap</text><text x="679" y="946" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >There is no minimum-separation enforcement, so one</text><text x="679" y="966" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pedestrian overtaking another can pass through it.</text></svg>