10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The deterministic weave</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Dense low-power crowds keep to their own side of the pavement — at O(1), no neighbour queries.</text><text x="70" y="156" font-size="18" fill="#E5534B" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Without weave</text><text x="270" y="156" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Everyone on the centreline. Opposing flows interpenetrate.</text><rect x="70" y="174" width="1140" height="112" rx="6" fill="#1a222c"/><line x1="70" y1="230" x2="1210" y2="230" stroke="#52606D" stroke-width="1" stroke-dasharray="6 8" opacity="0.7"/><text x="1196" y="194" font-size="11" fill="#9AA5B1" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pavement edge</text><text x="1196" y="226" font-size="11" fill="#9AA5B1" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >centreline</text><circle cx="108" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="134" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="178" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="204" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="248" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="274" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="318" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="344" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="388" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="414" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="458" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="484" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="528" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="554" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="598" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="624" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="668" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="694" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="738" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="764" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="808" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="834" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="878" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="904" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="948" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="974" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="1018" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="1044" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="1088" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="1114" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><circle cx="1158" cy="230" r="8" fill="#2BB3A3" opacity="0.9"/><circle cx="1184" cy="230" r="8" fill="#7FD8CE" opacity="0.9"/><text x="70" y="356" font-size="18" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >With weave</text><text x="270" y="356" font-size="14" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Each ped offset onto its own half as a function of its own inputs.</text><rect x="70" y="374" width="1140" height="112" rx="6" fill="#1a222c"/><line x1="70" y1="430" x2="1210" y2="430" stroke="#52606D" stroke-width="1" stroke-dasharray="6 8" opacity="0.7"/><text x="1196" y="394" font-size="11" fill="#9AA5B1" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pavement edge</text><text x="1196" y="426" font-size="11" fill="#9AA5B1" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >centreline</text><circle cx="108" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="140" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="178" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="210" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="248" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="280" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="318" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="350" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="388" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="420" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="458" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="490" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="528" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="560" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="598" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="630" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="668" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="700" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="738" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="770" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="808" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="840" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="878" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="910" cy="454" r="8" fill="#7FD8CE" opacity="0.95"/><circle cx="948" cy="406" r="8" fill="#2BB3A3" opacity="0.95"/><circle cx="980" cy="454" 