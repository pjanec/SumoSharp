y="Calibri, Arial, sans-serif" >crossing</text><circle cx="347" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="351" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="347" cy="700" r="8" fill="#2BB3A3" opacity="0.5"/><circle cx="349" cy="698" r="8" fill="#2BB3A3" opacity="0.5"/><text x="400" y="690" font-size="12" fill="#E5534B" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >23 peds on one point</text><rect x="655" y="578" width="555" height="168" rx="10" fill="#1a222c" stroke="#57A773" stroke-width="1.3" opacity="1.0"/><text x="679" y="606" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Seeded waiting spread</text><line x1="679" y1="712" x2="1185" y2="712" stroke="#52606D" stroke-width="2"/><text x="679" y="736" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >kerb</text><rect x="905" y="620" width="58" height="92" fill="#F5F7FA" opacity="0.05"/><text x="934" y="636" font-size="10" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >crossing</text><circle cx="882" cy="688" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="900" cy="698" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="916" cy="684" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="930" cy="696" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="946" cy="688" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="962" cy="700" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="980" cy="690" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="890" cy="708" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="908" cy="712" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="926" cy="710" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="944" cy="714" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="964" cy="710" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="982" cy="706" r="7" fill="#2BB3A3" opacity="0.95"/><circle cx="996" cy="694" r="7" fill="#2BB3A3" opacity="0.95"/><text x="1013" y="690" font-size="12" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >busiest 0.5 m cell: 2.5%</text><rect x="70" y="764" width="1140" height="74" rx="10" fill="#243040" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="94" y="792" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Both are the same mechanism: a per-pedestrian seeded offset, evaluated not solved.</text><text x="94" y="816" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >No neighbour lookups, no iteration, no shared state — every observer derives the identical offset independently.</text></svg>