<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="580" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >One seam couples the two worlds</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Cars see pedestrians through a single composite source — and what it contains defines the envelope.</text><rect x="70" y="140" width="330" height="110" rx="10" fill="#243040" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><text x="94" y="176" font-size="15" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Promoted ped footprints</text><text x="94" y="200" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >High-power ORCA agents only.</text><text x="94" y="222" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Rich, per-agent reactions.</text><rect x="70" y="276" width="330" height="110" rx="10" fill="#243040" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><text x="94" y="312" font-size="15" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Crossing occupancy</text><text x="94" y="336" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >EVERY pedestrian, promoted or not.</text><text x="94" y="358" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Covers the whole map.</text><line x1="400" y1="195" x2="470" y2="240" stroke="#2BB3A3" stroke-width="2.2"  marker-end="url(#ah-2BB3A3)"/><line x1="400" y1="331" x2="470" y2="286" stroke="#2BB3A3" stroke-width="2.2"  marker-end="url(#ah-2BB3A3)"/><rect x="475" y="232" width="250" height="62" rx="10" fill="#F5F7FA" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="600" y="258" font-size="15" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" >Engine.CrowdSource</text><text x="600" y="280" font-size="12" fill="#52606D" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >composite</text><line x1="725" y1="263" x2="800" y2="263" stroke="#F0B429" stroke-width="2.6"  marker-end="url(#ah-F0B429)"/><rect x="805" y="200" width="405" height="128" rx="10" fill="#243040" stroke="#F0B429" stroke-width="1.4" opacity="1.0"/><text x="829" y="236" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Krauss car-following</text><text x="829" y="260" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The model is unchanged. A pedestrian disc</text><text x="829" y="280" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >simply stands in as the leader.</text><text x="829" y="308" font-size="13" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >What is new is WHAT it reacts to, not HOW.</text><text x="70" y="424" font-size="17" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The consequence worth knowing</text><rect x="70" y="444" width="555" height="96" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="94" y="474" font-size="14" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >A car stops for any ped on a crossing</text><text x="94" y="496" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >even far from the camera, at the cheapest LOD —</text><text x="94" y="516" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >crossing occupancy covers everybody.</text><rect x="655" y="444" width="555" height="96" rx="8" fill="#2e2a22" stroke="#F0B429" stroke-width="1.2" opacity="1.0"/><text x="679" y="474" font-size="14" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Off-crossing, only promoted peds are seen</text><text x="679" y="496" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Put an interest source where you need full</text><text x="679" y="516" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >reactions. Today that is a deliberate cost choice.</text></svg>