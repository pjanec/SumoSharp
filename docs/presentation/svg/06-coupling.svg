<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="656" viewBox="0 0 1280 656" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="656" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >What a car can and cannot see</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Coupling is a level-of-detail decision, not a feature list. This is the envelope.</text><rect x="70" y="130" width="555" height="258" rx="12" fill="#1e2a34" stroke="#57A773" stroke-width="1.5" opacity="1.0"/><text x="96" y="170" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >INSIDE A REALISM ZONE</text><text x="96" y="200" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Assured</text><text x="96" y="236" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Pedestrians are promoted to full ORCA.</text><text x="96" y="260" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >They negotiate with each other, and cars yield.</text><circle cx="104" cy="292" r="3.5" fill="#57A773"/><text x="118" y="297" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >No pedestrian interpenetrates another.</text><circle cx="104" cy="318" r="3.5" fill="#57A773"/><text x="118" y="323" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >No car passes through a pedestrian.</text><circle cx="104" cy="344" r="3.5" fill="#57A773"/><text x="118" y="349" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Holds anywhere you place a zone.</text><rect x="655" y="130" width="555" height="258" rx="12" fill="#2e2a22" stroke="#F0B429" stroke-width="1.5" opacity="1.0"/><text x="681" y="170" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >OUTSIDE IT</text><text x="681" y="200" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Believable</text><text x="681" y="236" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Cheap and convincing at distance — by choice.</text><text x="681" y="260" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Performance bought with believability, not correctness.</text><circle cx="689" cy="292" r="3.5" fill="#F0B429"/><text x="703" y="297" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Same-direction pedestrians can overlap.</text><circle cx="689" cy="318" r="3.5" fill="#F0B429"/><text x="703" y="323" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A car can pass over a ped off a crossing.</text><circle cx="689" cy="344" r="3.5" fill="#57A773"/><text x="703" y="349" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >On a crossing a car DOES stop.</text><rect x="70" y="404" width="1140" height="52" rx="8" fill="#243040" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="94" y="436" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Stated up front it reads as engineering. Discovered under questioning it reads as a defect — so state it up front.</text><text x="70" y="506" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >How it is wired — deliberately unremarkable</text><rect x="70" y="524" width="340" height="96" rx="8" fill="#243040" stroke="#2BB3A3" stroke-width="1.2" opacity="1.0"/><text x="90" y="552" font-size="14" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Promoted ped footprints</text><text x="90" y="576" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >High-power ORCA agents only.</text><text x="90" y="596" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Rich, per-agent reactions.</text><rect x="440" y="524" width="340" height="96" rx="8" fill="#243040" stroke="#2BB3A3" stroke-width="1.2" opacity="1.0"/><text x="460" y="552" font-size="14" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Crossing occupancy</text><text x="460" y="576" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Low-power peds WALKING on a crossing.</text><text x="460" y="596" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Promoted and paused peds excluded.</text><rect x="810" y="524" width="400" height="96" rx="8" fill="#243040" stroke="#F0B429" stroke-width="1.2" opacity="1.0"/><text x="830" y="552" font-size="14" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Krauss car-following — unchanged</text><text x="830" y="576" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A pedestrian disc stands in as the leader.</text><text x="830" y="596" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >What is new is WHAT it reacts to, not HOW.</text><line x1="410" y1="572" x2="436" y2="572" stroke="#2BB3A3" stroke-width="2"  marker-end="url(#ah-2BB3A3)"/><line x1="780" y1="572" x2="806" y2="572" stroke="#F0B429" stroke-width="2.4"  marker-end="url(#ah-F0B429)"/></svg>