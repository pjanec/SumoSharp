<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="580" viewBox="0 0 1280 580" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="580" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Yielding on where the pedestrian will be</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A current-overlap test cannot see a conflict that has not happened yet.</text><rect x="70" y="132" width="530" height="300" rx="12" fill="#243040" stroke="#52606D" stroke-width="1.2" opacity="1.0"/><text x="96" y="170" font-size="19" fill="#E5534B" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Overlap only</text><text x="96" y="194" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Ped is not in my lane yet ⇒ no constraint. Car keeps speed.</text><rect x="96" y="238" width="478" height="80" fill="#1a222c"/><line x1="96" y1="278" x2="574" y2="278" stroke="#F0B429" stroke-width="1.6" stroke-dasharray="12 10" opacity="0.45"/><g transform="translate(190,278) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><circle cx="400" cy="342" r="9" fill="#2BB3A3" opacity="1.0"/><line x1="400" y1="332" x2="400" y2="288" stroke="#2BB3A3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-2BB3A3)"/><text x="96" y="372" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The car arrives at the same time as the</text><text x="96" y="392" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pedestrian. By the time they overlap it is</text><text x="96" y="412" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >too late to stop.</text><rect x="680" y="132" width="530" height="300" rx="12" fill="#243040" stroke="#52606D" stroke-width="1.2" opacity="1.0"/><text x="706" y="170" font-size="19" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Anticipatory</text><text x="706" y="194" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Ped's predicted corridor crosses mine ⇒ yield now.</text><rect x="706" y="238" width="478" height="80" fill="#1a222c"/><line x1="706" y1="278" x2="1184" y2="278" stroke="#F0B429" stroke-width="1.6" stroke-dasharray="12 10" opacity="0.45"/><g transform="translate(800,278) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><circle cx="1010" cy="342" r="9" fill="#2BB3A3" opacity="1.0"/><line x1="1010" y1="332" x2="1010" y2="288" stroke="#2BB3A3" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ah-2BB3A3)"/><rect x="992" y="240" width="36" height="104" fill="#2BB3A3" opacity="0.16"/><text x="1038" y="258" font-size="11" fill="#2BB3A3" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >predicted corridor</text><line x1="830" y1="278" x2="980" y2="278" stroke="#57A773" stroke-width="2.4"  marker-end="url(#ah-57A773)"/><text x="706" y="372" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Holds at contact, creeps below 1.5 m,</text><text x="706" y="392" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >evaluated on predicted clearance so it is</text><text x="706" y="412" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >reachable under braking.</text><rect x="70" y="460" width="1140" height="84" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="94" y="490" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Measured in-zone at 800 pedestrians</text><text x="94" y="512" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >close fast passes</text><text x="94" y="538" font-size="19" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >203 → 14</text><text x="454" y="512" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >driving AT a pedestrian</text><text x="454" y="538" font-size="19" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >11 → 0</text><text x="814" y="512" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >arrivals</text><text x="814" y="538" font-size="19" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >unchanged</text></svg>