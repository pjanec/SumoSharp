<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="640" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Half the network traffic is cars driving straight on</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The wire publishes on a change of lane IDENTITY — which a car crossing a junction does three times.</text><rect x="70" y="146" width="1140" height="168" rx="8" fill="#1a222c"/><rect x="120" y="204" width="260" height="52" rx="4" fill="#52606D" opacity="0.30"/><rect x="120" y="204" width="260" height="52" rx="4" fill="none" stroke="#52606D" stroke-width="1.4"/><text x="250.0" y="276" font-size="12" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >edge A_0</text><rect x="400" y="204" width="150" height="52" rx="4" fill="#F0B429" opacity="0.30"/><rect x="400" y="204" width="150" height="52" rx="4" fill="none" stroke="#F0B429" stroke-width="1.4"/><text x="475.0" y="276" font-size="12" fill="#F0B429" text-anchor="middle" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >: junction internal</text><rect x="570" y="204" width="260" height="52" rx="4" fill="#52606D" opacity="0.30"/><rect x="570" y="204" width="260" height="52" rx="4" fill="none" stroke="#52606D" stroke-width="1.4"/><text x="700.0" y="276" font-size="12" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >edge B_0</text><g transform="translate(150,230) rotate(0) scale(1.0)"><rect x="-13" y="-7" width="26" height="14" rx="3" fill="#F0B429"/><rect x="-5" y="-5" width="9" height="10" rx="1.5" fill="#1F2933" opacity="0.45"/></g><circle cx="330" cy="230" r="13" fill="#F0B429" opacity="0.9"/><text x="330" y="235" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >1</text><circle cx="470" cy="230" r="13" fill="#F0B429" opacity="0.9"/><text x="470" y="235" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >2</text><circle cx="640" cy="230" r="13" fill="#F0B429" opacity="0.9"/><text x="640" y="235" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >3</text><line x1="180" y1="230" x2="830" y2="230" stroke="#F0B429" stroke-width="2"  marker-end="url(#ah-F0B429)"/><text x="860" y="235" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >3 publishes, zero steering</text><text x="860" y="258" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >One intersection, one straight-through car.</text><text x="70" y="372" font-size="17" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Measured at 2 000 cars — what the 49.6% actually is</text><text x="94" y="418" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Real lateral lane change (same edge)</text><rect x="640" y="404" width="420" height="20" rx="4" fill="#1a222c"/><rect x="640" y="404" width="6" height="20" rx="4" fill="#57A773"/><text x="1080" y="419" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >0.7%</text><text x="94" y="458" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Drove onto the next lane of the route</text><rect x="640" y="444" width="420" height="20" rx="4" fill="#1a222c"/><rect x="640" y="444" width="205.38" height="20" rx="4" fill="#F0B429"/><text x="1080" y="459" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >48.9%</text><text x="94" y="498" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >└ of which entering / leaving a junction</text><rect x="640" y="484" width="420" height="20" rx="4" fill="#1a222c"/><rect x="640" y="484" width="104.58" height="20" rx="4" fill="#F0B429"/><text x="1080" y="499" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >24.9%</text><rect x="70" y="534" width="1140" height="74" rx="8" fill="#243040" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="94" y="562" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >So it is not the traffic — it is lane granularity.</text><text x="94" y="586" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >54% of this city cut's lanes are internal junction lanes; the median lane is 13.8 m. And it is irreducible: position on the wire is measured along a specific lane.</text></svg>