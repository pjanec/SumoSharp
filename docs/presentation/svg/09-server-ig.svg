<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="600" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The crowd costs almost nothing on the wire</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A closed-form pose means every observer can derive it — so it never has to be sent.</text><rect x="70" y="150" width="380" height="300" rx="12" fill="#243040" stroke="#52606D" stroke-width="1.2" opacity="1.0"/><text x="96" y="188" font-size="18" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Simulation server</text><circle cx="130" cy="250" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="190" cy="250" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="250" cy="250" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="130" cy="300" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="190" cy="300" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="250" cy="300" r="8" fill="#2BB3A3" opacity="1.0"/><text x="96" y="372" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >Evaluates pose = f(route, seed,</text><text x="96" y="392" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >width, t)</text><rect x="830" y="150" width="380" height="300" rx="12" fill="#243040" stroke="#52606D" stroke-width="1.2" opacity="1.0"/><text x="856" y="188" font-size="18" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Image generator</text><circle cx="890" cy="250" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="950" cy="250" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="1010" cy="250" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="890" cy="300" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="950" cy="300" r="8" fill="#2BB3A3" opacity="1.0"/><circle cx="1010" cy="300" r="8" fill="#2BB3A3" opacity="1.0"/><text x="856" y="372" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >Evaluates the SAME function</text><text x="856" y="392" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >⇒ bit-identical pose</text><rect x="478" y="232" width="324" height="60" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.4" opacity="1.0"/><text x="640" y="258" font-size="15" fill="#57A773" text-anchor="middle" font-weight="bold" font-family="Consolas, 'Courier New', monospace" >route + seed</text><text x="640" y="280" font-size="12" fill="#F5F7FA" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >sent ONCE</text><line x1="452" y1="262" x2="470" y2="262" stroke="#57A773" stroke-width="2.4"  marker-end="url(#ah-57A773)"/><line x1="806" y1="262" x2="826" y2="262" stroke="#57A773" stroke-width="2.4"  marker-end="url(#ah-57A773)"/><text x="640" y="336" font-size="15" fill="#57A773" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >then zero per-step bytes</text><text x="640" y="360" font-size="13" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >for every ambient pedestrian</text><rect x="70" y="486" width="1140" height="78" rx="8" fill="#243040" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="94" y="514" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Proven bit-identical over an in-process byte loopback and over real CycloneDDS.</text><text x="94" y="540" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The consequence: crowd size is decoupled from bandwidth entirely.</text></svg>