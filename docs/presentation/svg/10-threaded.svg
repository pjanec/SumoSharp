<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="696" viewBox="0 0 1280 696" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="696" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The tick runs on its own thread</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A frame never waits for an engine step. The renderer only ever reads a published snapshot.</text><rect x="150" y="148" width="1060" height="118" rx="6" fill="#1a222c"/><text x="140" y="184" font-size="12" fill="#9AA5B1" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >render</text><text x="140" y="240" font-size="12" fill="#9AA5B1" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >engine</text><rect x="170" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="200" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="230" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="260" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="290" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="320" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="350" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="380" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="410" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="440" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="470" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="500" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="530" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="560" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="590" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="620" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="650" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="680" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="710" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="740" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="770" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="800" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="830" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="860" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="890" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="920" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="950" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="980" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="1010" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="1040" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="1070" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="1100" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="1130" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="1160" y="168" width="22" height="26" rx="3" fill="#52606D"/><rect x="170" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="292" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="414" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="536" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="658" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="780" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="902" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="1024" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><rect x="1146" y="224" width="112" height="26" rx="3" fill="#F0B429" opacity="0.85"/><text x="1196" y="280" font-size="13" fill="#57A773" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >every frame lands · the producer thread owns the step</text><rect x="70" y="316" width="555" height="138" rx="10" fill="#243040" stroke="#2BB3A3" stroke-width="1.3" opacity="1.0"/><text x="94" y="348" font-size="15" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The handoff</text><text x="94" y="374" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The engine publishes a snapshot; the renderer reads it.</text><text x="94" y="396" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Neither ever blocks on the other.</text><text x="94" y="424" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Engine parallelism is capped so the producer</text><text x="94" y="442" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >cannot starve the renderer.</text><rect x="655" y="316" width="555" height="138" rx="10" fill="#1e2a34" stroke="#57A773" stroke-width="1.3" opacity="1.0"/><text x="679" y="348" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Capping was proven inert, not assumed</text><text x="679" y="374" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >11 889 car and pedestrian samples bitwise</text><text x="679" y="396" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >identical, capped versus uncapped.</text><text x="679" y="424" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Smoothness did not cost a trajectory.</text><rect x="70" y="478" width="1140" height="84" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="94" y="508" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Measured on a real city cut at 3 858 cars + 20 726 pedestrians</text><text x="94" y="530" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >frames over 3x median</text><text x="94" y="556" font-size="19" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >0 of 2000</text><text x="454" y="530" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >p99 vs p50</text><text x="454" y="556" font-size="19" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >1.20x</text><text x="814" y="530" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >sustained in real time</text><text x="814" y="556" font-size="19" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >2 Hz</text><rect x="70" y="586" width="1140" height="74" rx="8" fill="#2a2438" stroke="#C7A4FF" stroke-width="1.2" opacity="1.0"/><text x="94" y="616" font-size="14" fill="#C7A4FF" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Next</text><text x="94" y="642" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Extending the same handoff discipline to more consumers, and to the sim-rate and zone controls under load. Reach, not repair.</text></svg>