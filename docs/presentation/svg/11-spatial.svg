<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="774" viewBox="0 0 1280 774" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="774" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >How the work is spread across cores</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Two mechanisms. Both byte-identical to a serial run — parallelism is never allowed to cost an answer.</text><rect x="70" y="132" width="470" height="340" rx="12" fill="#243040" stroke="#F0B429" stroke-width="1.4" opacity="1.0"/><text x="94" y="168" font-size="14" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >SPATIAL DECOMPOSITION</text><text x="94" y="192" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >opt-in  ·  --region --region-grid G</text><rect x="122" y="212" width="52" height="52" rx="3" fill="#2f3a46" stroke="#52606D" stroke-width="0.8"/><rect x="178" y="212" width="52" height="52" rx="3" fill="#38424e" stroke="#52606D" stroke-width="0.8"/><rect x="234" y="212" width="52" height="52" rx="3" fill="#2a3440" stroke="#52606D" stroke-width="0.8"/><rect x="290" y="212" width="52" height="52" rx="3" fill="#414c58" stroke="#52606D" stroke-width="0.8"/><rect x="122" y="268" width="52" height="52" rx="3" fill="#38424e" stroke="#52606D" stroke-width="0.8"/><rect x="178" y="268" width="52" height="52" rx="3" fill="#4a5663" stroke="#52606D" stroke-width="0.8"/><rect x="234" y="268" width="52" height="52" rx="3" fill="#2f3a46" stroke="#52606D" stroke-width="0.8"/><rect x="290" y="268" width="52" height="52" rx="3" fill="#38424e" stroke="#52606D" stroke-width="0.8"/><rect x="122" y="324" width="52" height="52" rx="3" fill="#2a3440" stroke="#52606D" stroke-width="0.8"/><rect x="178" y="324" width="52" height="52" rx="3" fill="#2f3a46" stroke="#52606D" stroke-width="0.8"/><rect x="234" y="324" width="52" height="52" rx="3" fill="#38424e" stroke="#52606D" stroke-width="0.8"/><rect x="290" y="324" width="52" height="52" rx="3" fill="#2a3440" stroke="#52606D" stroke-width="0.8"/><rect x="122" y="380" width="52" height="52" rx="3" fill="#38424e" stroke="#52606D" stroke-width="0.8"/><rect x="178" y="380" width="52" height="52" rx="3" fill="#2a3440" stroke="#52606D" stroke-width="0.8"/><rect x="234" y="380" width="52" height="52" rx="3" fill="#2f3a46" stroke="#52606D" stroke-width="0.8"/><rect x="290" y="380" width="52" height="52" rx="3" fill="#38424e" stroke="#52606D" stroke-width="0.8"/><rect x="178" y="268" width="52" height="52" rx="3" fill="none" stroke="#F0B429" stroke-width="2.5"/><text x="366" y="294" font-size="12" fill="#F0B429" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >congestion</text><text x="366" y="312" font-size="12" fill="#F0B429" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >concentrates here</text><text x="94" y="456" font-size="13.5" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Each region owns a DISJOINT set of lanes.</text><rect x="570" y="132" width="640" height="104" rx="10" fill="#1e2a34" stroke="#57A773" stroke-width="1.3" opacity="1.0"/><text x="594" y="162" font-size="14.5" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Lock-free by construction, not by care</text><text x="594" y="188" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Disjoint lane ownership means region tasks need no locks</text><text x="594" y="210" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >at all. There is no critical section to get wrong.</text><rect x="570" y="250" width="640" height="104" rx="10" fill="#1e2a34" stroke="#57A773" stroke-width="1.3" opacity="1.0"/><text x="594" y="280" font-size="14.5" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Boundary handoff is free</text><text x="594" y="306" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A vehicle crossing out is simply grouped in the next</text><text x="594" y="328" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >region next step. No state transfer, no migration.</text><rect x="570" y="368" width="640" height="104" rx="10" fill="#1e2a34" stroke="#57A773" stroke-width="1.3" opacity="1.0"/><text x="594" y="398" font-size="14.5" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >It balances itself</text><text x="594" y="424" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Dynamic scheduling over regions: as load concentrates,</text><text x="594" y="446" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >a busy region is picked up by whichever thread is free.</text><rect x="70" y="502" width="555" height="132" rx="10" fill="#243040" stroke="#F0B429" stroke-width="1.3" opacity="1.0"/><text x="94" y="532" font-size="14.5" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Per-vehicle phase parallelism</text><text x="94" y="556" font-size="12.5" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >on by default above a few hundred vehicles</text><text x="94" y="582" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Plan, export and post-move read only frozen</text><text x="94" y="602" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >start-of-step state and write only their own vehicle.</text><text x="94" y="622" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Structural change is deferred to a command buffer.</text><rect x="655" y="502" width="555" height="132" rx="10" fill="#243040" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="679" y="530" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >More threads is not automatically better</text><rect x="700" y="560.0" width="30" height="62.0" rx="2" fill="#52606D" opacity="0.9"/><text x="715" y="640" font-size="11" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >1</text><text x="715" y="554.0" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >11.5</text><rect x="774" y="579.3344947735192" width="30" height="42.66550522648084" rx="2" fill="#52606D" opacity="0.9"/><text x="789" y="640" font-size="11" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >2</text><text x="789" y="573.3344947735192" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >7.9</text><rect x="848" y="587.7595818815331" width="30" height="34.2404181184669" rx="2" fill="#52606D" opacity="0.9"/><text x="863" y="640" font-size="11" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >4</text><text x="863" y="581.7595818815331" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >6.3</text><rect x="922" y="591.3240418118467" width="30" height="30.675958188153306" rx="2" fill="#57A773" opacity="0.9"/><text x="937" y="640" font-size="11" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >8</text><text x="937" y="585.3240418118467" font-size="10" fill="#57A773" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >5.7</text><rect x="996" y="591.3780487804878" width="30" height="30.621951219512194" rx="2" fill="#52606D" opacity="0.9"/><text x="1011" y="640" font-size="11" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >16</text><text x="1011" y="585.3780487804878" font-size="10" fill="#52606D" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >5.7</text><rect x="1070" y="588.8937282229965" width="30" height="33.106271777003485" rx="2" fill="#E5534B" opacity="0.9"/><text x="1085" y="640" font-size="11" fill="#9AA5B1" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >24</text><text x="1085" y="582.8937282229965" font-size="10" fill="#E5534B" text-anchor="middle" font-weight="normal" font-family="Calibri, Arial, sans-serif" >6.1</text><text x="1142" y="640" font-size="11" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >threads</text><line x1="694" y1="624" x2="1150" y2="624" stroke="#52606D" stroke-width="1" opacity="0.6"/><text x="1186" y="552" font-size="12.5" fill="#57A773" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >8 beats 24. The knee is at 4.</text><rect x="70" y="650" width="1140" height="88" rx="8" fill="#2e2a22" stroke="#F0B429" stroke-width="1.2" opacity="1.0"/><text x="94" y="680" font-size="14" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The honest reading</text><text x="94" y="706" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Today's region win is modest: the dominant phases are bound by MEMORY BANDWIDTH on random neighbour access, not by CPU.</text><text x="94" y="728" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The hard part — disjoint ownership, free handoff, safety by construction — is done. A segmented store is what turns it into a large win.</text></svg>