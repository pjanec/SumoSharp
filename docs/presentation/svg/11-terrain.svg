<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="620" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Real ground, and pedestrians that know which surface they are on</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Terrain is baked from the network's own lane elevations — no external heightmap.</text><text x="70" y="152" font-size="16" fill="#E5534B" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Flat datum</text><rect x="70" y="168" width="530" height="150" rx="6" fill="#1a222c"/><line x1="90" y1="270" x2="580" y2="270" stroke="#E5534B" stroke-width="2"/><path d="M 90 296 Q 220 210 335 250 T 580 214" fill="none" stroke="#9AA5B1" stroke-width="2" stroke-dasharray="5 4"/><text x="90" y="196" font-size="13" fill="#E5534B" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >up to ~14 m of error</text><text x="586" y="306" font-size="11" fill="#9AA5B1" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >true ground</text><text x="680" y="152" font-size="16" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Baked terrain field</text><rect x="680" y="168" width="530" height="150" rx="6" fill="#1a222c"/><path d="M 700 296 Q 830 210 945 250 T 1190 214" fill="none" stroke="#57A773" stroke-width="2.4"/><circle cx="700" cy="296" r="3.5" fill="#F0B429"/><circle cx="790" cy="235" r="3.5" fill="#F0B429"/><circle cx="880" cy="232" r="3.5" fill="#F0B429"/><circle cx="945" cy="250" r="3.5" fill="#F0B429"/><circle cx="1050" cy="228" r="3.5" fill="#F0B429"/><circle cx="1190" cy="214" r="3.5" fill="#F0B429"/><text x="700" y="196" font-size="13" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >0.326 m worst error</text><text x="1196" y="306" font-size="11" fill="#F0B429" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >lane vertices</text><text x="70" y="372" font-size="17" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Stacked surfaces: the same plan-view point, two heights</text><rect x="70" y="392" width="1140" height="176" rx="8" fill="#1a222c"/><rect x="240" y="432" width="800" height="12" rx="3" fill="#52606D"/><text x="250" y="424" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >footbridge</text><rect x="240" y="524" width="800" height="12" rx="3" fill="#52606D"/><text x="250" y="516" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >path beneath</text><circle cx="640" cy="424" r="9" fill="#2BB3A3" opacity="1.0"/><circle cx="640" cy="516" r="9" fill="#7FD8CE" opacity="1.0"/><line x1="640" y1="400" x2="640" y2="548" stroke="#F0B429" stroke-width="1.4" stroke-dasharray="4 4" opacity="0.8"/><text x="672" y="428" font-size="15" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >412.5 m</text><text x="672" y="520" font-size="15" fill="#7FD8CE" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >400.0 m</text><text x="1020" y="470" font-size="13" fill="#F0B429" text-anchor="end" font-weight="normal" font-family="Calibri, Arial, sans-serif" >identical (x, y)</text><text x="94" y="592" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Per-vertex surface provenance travels with the route, so height is resolved along the path the pedestrian actually walks — never by a nearest-surface guess.</text></svg>