<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="510" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Panic evacuation — on a completely unmodified driving core</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Fear is local information, not a global flag. The layer only drives public seams.</text><rect x="70" y="140" width="172" height="190" rx="10" fill="#243040" stroke="#E5534B" stroke-width="1.4" opacity="1.0"/><circle cx="96" cy="172" r="13" fill="#E5534B"/><text x="96" y="177" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >1</text><text x="118" y="177" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Incident</text><text x="88" y="214" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A localised event.</text><line x1="246" y1="235" x2="260" y2="235" stroke="#9AA5B1" stroke-width="2"  marker-end="url(#ah-9AA5B1)"/><rect x="264" y="140" width="172" height="190" rx="10" fill="#243040" stroke="#E5534B" stroke-width="1.4" opacity="1.0"/><circle cx="290" cy="172" r="13" fill="#E5534B"/><text x="290" y="177" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >2</text><text x="312" y="177" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Fear spreads</text><text x="282" y="214" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Line-of-sight gated,</text><text x="282" y="233" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >plus contagion and</text><text x="282" y="252" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >jam-unease.</text><line x1="440" y1="235" x2="454" y2="235" stroke="#9AA5B1" stroke-width="2"  marker-end="url(#ah-9AA5B1)"/><rect x="458" y="140" width="172" height="190" rx="10" fill="#243040" stroke="#F0B429" stroke-width="1.4" opacity="1.0"/><circle cx="484" cy="172" r="13" fill="#F0B429"/><text x="484" y="177" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >3</text><text x="506" y="177" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Flee</text><text x="476" y="214" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Aggressive preset,</text><text x="476" y="233" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >reroute to exits.</text><line x1="634" y1="235" x2="648" y2="235" stroke="#9AA5B1" stroke-width="2"  marker-end="url(#ah-9AA5B1)"/><rect x="652" y="140" width="172" height="190" rx="10" fill="#243040" stroke="#F0B429" stroke-width="1.4" opacity="1.0"/><circle cx="678" cy="172" r="13" fill="#F0B429"/><text x="678" y="177" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >4</text><text x="700" y="177" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Gridlock</text><text x="670" y="214" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The streets jam.</text><line x1="828" y1="235" x2="842" y2="235" stroke="#9AA5B1" stroke-width="2"  marker-end="url(#ah-9AA5B1)"/><rect x="846" y="140" width="172" height="190" rx="10" fill="#243040" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><circle cx="872" cy="172" r="13" fill="#2BB3A3"/><text x="872" y="177" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >5</text><text x="894" y="177" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Abandon</text><text x="864" y="214" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Boxed-in driver</text><text x="864" y="233" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >noses onto the</text><text x="864" y="252" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >shoulder, gets out.</text><line x1="1022" y1="235" x2="1036" y2="235" stroke="#9AA5B1" stroke-width="2"  marker-end="url(#ah-9AA5B1)"/><rect x="1040" y="140" width="172" height="190" rx="10" fill="#243040" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><circle cx="1066" cy="172" r="13" fill="#2BB3A3"/><text x="1066" y="177" font-size="13" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >6</text><text x="1088" y="177" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Foot exodus</text><text x="1058" y="214" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The crowd streams</text><text x="1058" y="233" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >out; cars react to</text><text x="1058" y="252" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >it as obstacles.</text><rect x="70" y="362" width="555" height="118" rx="10" fill="#243040" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="94" y="392" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Cost follows the incident, not the map</text><text x="94" y="418" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The layer attaches only within a bounded working</text><text x="94" y="438" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >region, so a city-scale run pays for the affected</text><text x="94" y="458" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >neighbourhood while the rest keeps flowing normally.</text><rect x="655" y="362" width="555" height="118" rx="10" fill="#243040" stroke="#F5F7FA" stroke-width="1.2" opacity="1.0"/><text x="679" y="392" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The parity core never learns about any of it</text><text x="679" y="418" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Sim.Evac drives the engine through the same public</text><text x="679" y="438" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >seams any integrator uses. With panic off, the</text><text x="679" y="458" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >determinism hash does not move.</text></svg>