t-family="Calibri, Arial, sans-serif" >Pedestrians promote to full ORCA.</text><text x="815" y="222" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Cars use cooperative lane changing.</text><text x="815" y="242" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Cars yield to pedestrians in their path.</text><text x="815" y="292" font-size="17" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Outside</text><text x="815" y="318" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Closed-form pedestrians at O(1).</text><text x="815" y="338" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Cars still stop at crossings.</text><rect x="815" y="374" width="395" height="166" rx="10" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="837" y="404" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Verified in routine use</text><text x="837" y="438" font-size="32" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >10 000</text><text x="839" y="458" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >vehicles</text><text x="1025" y="438" font-size="32" fill="#6FE3D2" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >30 000</text><text x="1027" y="458" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pedestrians</text><text x="837" y="496" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >in the Godot 3-D viewer, in routine use</text><text x="837" y="516" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >— with headroom on the pedestrian side</text></svg>