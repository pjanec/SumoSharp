<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="596" viewBox="0 0 1280 596" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="596" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Why these numbers can be trusted</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The rules below were each bought with a wrong answer that shipped and had to be retracted.</text><rect x="70" y="138" width="555" height="196" rx="10" fill="#243040" stroke="#57A773" stroke-width="1.4" opacity="1.0"/><circle cx="98" cy="170" r="12" fill="#57A773"/><text x="122" y="175" font-size="16" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Both surfaces must accept a change</text><text x="94" y="212" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Goldens are small and cannot contain a saturated junction; the</text><text x="94" y="233" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >demo saturates but has no SUMO reference. One change kept all</text><text x="94" y="254" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >goldens byte-identical and made the demo worse. Another</text><text x="94" y="275" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >transformed the demo and broke 14 goldens. So: run both.</text><rect x="655" y="138" width="555" height="196" rx="10" fill="#243040" stroke="#F0B429" stroke-width="1.4" opacity="1.0"/><circle cx="683" cy="170" r="12" fill="#F0B429"/><text x="707" y="175" font-size="16" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Trace, do not reason</text><text x="679" y="212" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Seven interventions reasoned from the SUMO source were refuted</text><text x="679" y="233" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >against one per-vehicle trace that found the real cause in</text><text x="679" y="254" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >minutes. Reading tells you what a mechanism is; only a trace</text><text x="679" y="275" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >tells you what is actually happening.</text><rect x="70" y="356" width="555" height="196" rx="10" fill="#243040" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><circle cx="98" cy="388" r="12" fill="#2BB3A3"/><text x="122" y="393" font-size="16" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Commit the instrument</text><text x="94" y="430" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A probe run once and reverted makes its own number</text><text x="94" y="451" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >unfalsifiable and poisons every later comparison. Every</text><text x="94" y="472" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >measurement in this deck has a committed tool behind it that</text><text x="94" y="493" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >anyone can re-run.</text><rect x="655" y="356" width="555" height="196" rx="10" fill="#243040" stroke="#E5534B" stroke-width="1.4" opacity="1.0"/><circle cx="683" cy="388" r="12" fill="#E5534B"/><text x="707" y="393" font-size="16" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Compare against honest SUMO</text><text x="679" y="430" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >SUMO's shipped defaults teleport stuck vehicles and do not even</text><text x="679" y="451" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >DETECT junction interpenetration. Beating those defaults is not</text><text x="679" y="472" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >an achievement, so the comparison runs with the cheats off.</text></svg>