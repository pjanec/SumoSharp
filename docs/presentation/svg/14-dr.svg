<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="840" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Dead reckoning: 48 bytes buys a trajectory, not a sample</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The receiver is not told where a car IS. It is told enough to work out where it WILL be.</text><text x="70" y="148" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >ONCE, UP FRONT</text><text x="232" y="148" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >durable — a late-joining viewer gets it without the network file</text><rect x="70" y="162" width="555" height="132" rx="10" fill="#243040" stroke="#52606D" stroke-width="1.3" opacity="1.0"/><text x="94" y="192" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Lane geometry</text><text x="94" y="216" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >per lane: handle · width · length · centreline points (+z)</text><text x="94" y="248" font-size="22" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >2.86 MiB</text><text x="196" y="248" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >for 28 276 lanes — a whole city, sent once</text><text x="94" y="278" font-size="12.5" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >This is what makes 48 B per update enough.</text><rect x="655" y="162" width="555" height="132" rx="10" fill="#243040" stroke="#52606D" stroke-width="1.3" opacity="1.0"/><text x="679" y="192" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Per agent, on spawn</text><text x="679" y="216" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >handle · vType · length · width · id</text><text x="679" y="248" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Physical dimensions travel ONCE,</text><text x="679" y="268" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >never in a per-frame packet.</text><text x="679" y="288" font-size="12.5" fill="#2BB3A3" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Pedestrian route / timeline: also once.</text><text x="70" y="340" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >PER UPDATE</text><text x="190" y="340" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >and only when dead reckoning would otherwise be wrong</text><rect x="70" y="354" width="360" height="200" rx="10" fill="#2e2a22" stroke="#F0B429" stroke-width="1.4" opacity="1.0"/><text x="94" y="384" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Car</text><text x="94" y="414" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >48 B</text><circle cx="100" cy="437" r="3" fill="#F0B429"/><text x="112" y="441" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >lane + arc-position</text><circle cx="100" cy="461" r="3" fill="#F0B429"/><text x="112" y="465" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >speed + acceleration</text><circle cx="100" cy="485" r="3" fill="#F0B429"/><text x="112" y="489" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >lateral pos + lateral speed</text><circle cx="100" cy="509" r="3" fill="#F0B429"/><text x="112" y="513" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >the next 4 lanes ahead</text><text x="94" y="540" font-size="12.5" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >= a trajectory the receiver integrates</text><rect x="450" y="354" width="360" height="200" rx="10" fill="#1e2f2c" stroke="#2BB3A3" stroke-width="1.4" opacity="1.0"/><text x="474" y="384" font-size="15" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Pedestrian</text><text x="474" y="414" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >18 B</text><text x="560" y="414" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >if reactive (ORCA)</text><text x="474" y="452" font-size="30" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >0 B</text><text x="546" y="452" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >if ambient</text><text x="474" y="486" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >An ambient pedestrian emits NOTHING</text><text x="474" y="506" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >per step — its pose is a function both</text><text x="474" y="526" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >ends already evaluate independently.</text><rect x="830" y="354" width="380" height="200" rx="10" fill="#243040" stroke="#52606D" stroke-width="1.3" opacity="1.0"/><text x="854" y="384" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Sent when?</text><circle cx="860" cy="412" r="3.5" fill="#F0B429"/><text x="874" y="416" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >the predicted position drifts too far</text><circle cx="860" cy="438" r="3.5" fill="#F0B429"/><text x="874" y="442" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >the lane identity changes</text><circle cx="860" cy="464" r="3.5" fill="#9AA5B1"/><text x="874" y="468" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >a 3 s liveliness heartbeat elapses</text><text x="854" y="500" font-size="12.5" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A genuinely steady car diverges by ~0</text><text x="854" y="520" font-size="12.5" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >from its own prediction — so nothing</text><text x="854" y="540" font-size="12.5" fill="#57A773" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >is sent at all.</text><text x="70" y="600" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >WHAT THAT SAVES</text><text x="228" y="600" font-size="13" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >measured on a real city cut, vehicles only</text><text x="94" y="637" font-size="13.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Naive: a pose every rendered frame</text><rect x="470" y="620" width="520" height="24" rx="4" fill="#1a222c"/><rect x="470" y="620" width="520.0" height="24" rx="4" fill="#E5534B"/><text x="1006" y="638" font-size="14" fill="#E5534B" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >60 / car / s</text><text x="94" y="671" font-size="13.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A packet every simulation step</text><rect x="470" y="654" width="520" height="24" rx="4" fill="#1a222c"/><rect x="470" y="654" width="17.16" height="24" rx="4" fill="#F0B429"/><text x="1006" y="672" font-size="14" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >2 / car / s</text><text x="94" y="705" font-size="13.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Dead-reckoned, measured</text><rect x="470" y="688" width="520" height="24" rx="4" fill="#1a222c"/><rect x="470" y="688" width="7" height="24" rx="4" fill="#57A773"/><text x="1006" y="706" font-size="14" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >0.64 / car / s</text><rect x="70" y="730" width="555" height="76" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="94" y="758" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >94x fewer messages than the render rate</text><text x="94" y="782" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >and motion still reconstructs smooth at 60 fps.</text><rect x="655" y="730" width="555" height="76" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="679" y="758" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >4 000 cars = 125 KiB/s. 30 000 ambient peds = 0.</text><text x="679" y="782" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Crowd size is decoupled from bandwidth entirely.</text></svg>