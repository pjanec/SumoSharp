<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="600" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >City life is authored data, not a behaviour loop</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Four segment kinds compose into every beat below — and all of it stays low-power.</text><text x="70" y="148" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >THE VOCABULARY</text><rect x="70" y="162" width="272" height="82" rx="10" fill="#1e2f2c" stroke="#2BB3A3" stroke-width="1.3" opacity="1.0"/><text x="88" y="192" font-size="16" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Walk</text><text x="88" y="216" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >follow the route</text><rect x="355" y="162" width="272" height="82" rx="10" fill="#1e2f2c" stroke="#2BB3A3" stroke-width="1.3" opacity="1.0"/><text x="373" y="192" font-size="16" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Pause</text><text x="373" y="216" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >stop in place: phone, sip, look</text><rect x="640" y="162" width="272" height="82" rx="10" fill="#1e2f2c" stroke="#2BB3A3" stroke-width="1.3" opacity="1.0"/><text x="658" y="192" font-size="16" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Dwell</text><text x="658" y="216" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >stay put — optionally unseen</text><rect x="925" y="162" width="272" height="82" rx="10" fill="#1e2f2c" stroke="#2BB3A3" stroke-width="1.3" opacity="1.0"/><text x="943" y="192" font-size="16" fill="#2BB3A3" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Interact</text><text x="943" y="216" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >a Dwell that names a partner</text><text x="70" y="288" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >THE BEATS THEY COMPOSE INTO</text><text x="346" y="288" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >each one a generator that emits an ordinary timeline — no new evaluator</text><rect x="70" y="302" width="272" height="148" rx="10" fill="#243040" stroke="#52606D" stroke-width="1.3" opacity="1.0"/><circle cx="96" cy="332" r="12" fill="#2BB3A3"/><text x="96" y="337" font-size="12" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >1</text><text x="118" y="337" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Checking a phone</text><text x="88" y="366" font-size="11" fill="#2BB3A3" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >Walk → Pause("phone") → Walk</text><text x="88" y="392" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >A pause carries an animation tag and no</text><text x="88" y="411" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pose of its own, so the walk either side</text><text x="88" y="430" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >stays continuous.</text><rect x="355" y="302" width="272" height="148" rx="10" fill="#243040" stroke="#52606D" stroke-width="1.3" opacity="1.0"/><circle cx="381" cy="332" r="12" fill="#2BB3A3"/><text x="381" y="337" font-size="12" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >2</text><text x="403" y="337" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Meeting, then parting</text><text x="373" y="366" font-size="11" fill="#2BB3A3" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >paired Interact in BOTH timelines</text><text x="373" y="392" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Two pedestrians agree one meet point,</text><text x="373" y="411" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >time and duration, stand ~1.2 m apart,</text><text x="373" y="430" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >talk, then walk on.</text><rect x="640" y="302" width="272" height="148" rx="10" fill="#243040" stroke="#52606D" stroke-width="1.3" opacity="1.0"/><circle cx="666" cy="332" r="12" fill="#2BB3A3"/><text x="666" y="337" font-size="12" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >3</text><text x="688" y="337" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Serving outdoor tables</text><text x="658" y="366" font-size="11" fill="#2BB3A3" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >loop: door → table → serve → inside</text><text x="658" y="392" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Tables visited in a seed-varied order.</text><text x="658" y="411" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The dwell inside the building is a real</text><text x="658" y="430" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pose that is simply not drawn.</text><rect x="925" y="302" width="272" height="148" rx="10" fill="#243040" stroke="#52606D" stroke-width="1.3" opacity="1.0"/><circle cx="951" cy="332" r="12" fill="#2BB3A3"/><text x="951" y="337" font-size="12" fill="#1F2933" text-anchor="middle" font-weight="bold" font-family="Calibri, Arial, sans-serif" >4</text><text x="973" y="337" font-size="14.5" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Boarding a car</text><text x="943" y="366" font-size="11" fill="#F0B429" text-anchor="start" font-weight="normal" font-family="Consolas, 'Courier New', monospace" >Walking → Riding</text><text x="943" y="392" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The person leaves the crowd entirely on</text><text x="943" y="411" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >boarding, and the car drives away with</text><text x="943" y="430" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >mutual avoidance in the lot.</text><rect x="70" y="476" width="555" height="96" rx="8" fill="#1e2a34" stroke="#57A773" stroke-width="1.2" opacity="1.0"/><text x="94" y="506" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >None of this costs a per-step behaviour loop</text><text x="94" y="532" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Liveliness adds richer one-time DATA, not per-tick work — so a</text><text x="94" y="552" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >living city stays as cheap, and as reconstructable, as a walking one.</text><rect x="655" y="476" width="555" height="96" rx="8" fill="#2e2a22" stroke="#F0B429" stroke-width="1.2" opacity="1.0"/><text x="679" y="506" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >What is next: the director, not the behaviours</text><text x="679" y="532" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The beats exist and are deterministic. What is designed but not</text><text x="679" y="552" font-size="12.5" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >built is placing them automatically from venue records, city-wide.</text></svg>