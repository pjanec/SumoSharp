<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="600" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Already fast — and the remaining headroom is already located</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Nothing below is a mystery. Each lever is measured, attributed, and waiting its turn.</text><text x="70" y="150" font-size="14" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >WHAT HAS ALREADY LANDED</text><circle cx="84" cy="176" r="6" fill="#57A773"/><text x="102" y="181" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Allocation collapsed</text><text x="102" y="201" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >the hot path stopped allocating per car, per step</text><circle cx="84" cy="232" r="6" fill="#57A773"/><text x="102" y="237" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >GC pressure removed</text><text x="102" y="257" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pause time down to a small fraction of wall</text><circle cx="84" cy="288" r="6" fill="#57A773"/><text x="102" y="293" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Parallel by default at scale</text><text x="102" y="313" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >and byte-identical to the serial run, by test</text><circle cx="84" cy="344" r="6" fill="#57A773"/><text x="102" y="349" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Engine tick off the render thread</text><text x="102" y="369" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >frame hitches gone at full density</text><circle cx="84" cy="400" r="6" fill="#57A773"/><text x="102" y="405" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Faster per tick than SUMO</text><text x="102" y="425" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >single-threaded, before any parallelism</text><text x="660" y="150" font-size="14" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >WHAT IS STILL ON THE TABLE</text><circle cx="674" cy="176" r="6" fill="#F0B429"/><text x="692" y="181" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Neighbour cap in the crowd solver</text><text x="692" y="201" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >considers every agent in range where the reference</text><text x="692" y="218" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >implementation caps at ten — the largest single lever</text><circle cx="674" cy="232" r="6" fill="#F0B429"/><text x="692" y="237" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Pedestrian spawn cost</text><text x="692" y="257" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >scales with the walkable graph, not with the spawn</text><circle cx="674" cy="288" r="6" fill="#F0B429"/><text x="692" y="293" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Route cache defeated by its own key</text><text x="692" y="313" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >so it never shares between vehicles, and never shrinks</text><circle cx="674" cy="344" r="6" fill="#F0B429"/><text x="692" y="349" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Insertion cost under saturation</text><text x="692" y="369" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >quadratic exactly when a user cranks density past capacity</text><circle cx="674" cy="400" r="6" fill="#F0B429"/><text x="692" y="405" font-size="14" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Cache layout of the crowd hot loop</text><text x="692" y="425" font-size="12" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >three arrays read together, not yet packed together</text><rect x="70" y="468" width="1140" height="96" rx="10" fill="#243040" stroke="none" stroke-width="1.5" opacity="1.0"/><text x="94" y="498" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >The reason the list is specific rather than aspirational</text><text x="94" y="524" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Every entry was found by measuring, then attributed to a named cause, then left alone until its turn. The largest one changes</text><text x="94" y="544" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >pedestrian trajectories, so it ships opt-in and off by default — a deliberate choice, not an oversight.</text></svg>