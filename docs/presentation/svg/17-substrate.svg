<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="692" viewBox="0 0 1280 692" font-family="Calibri, Arial, sans-serif"><rect width="1280" height="692" fill="#1F2933"/><defs><marker id="ah-1F2933" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#1F2933"/></marker><marker id="ah-52606D" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#52606D"/></marker><marker id="ah-9AA5B1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#9AA5B1"/></marker><marker id="ah-F5F7FA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F5F7FA"/></marker><marker id="ah-2A3440" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2A3440"/></marker><marker id="ah-F0B429" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#F0B429"/></marker><marker id="ah-2BB3A3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2BB3A3"/></marker><marker id="ah-E5534B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#E5534B"/></marker><marker id="ah-57A773" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#57A773"/></marker><marker id="ah-6FE3D2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6FE3D2"/></marker><marker id="ah-C7A4FF" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#C7A4FF"/></marker><marker id="ah-7FD8CE" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#7FD8CE"/></marker></defs><text x="56" y="62" font-size="30" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >What you have seen is a substrate, not a finished product</text><text x="56" y="92" font-size="16" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Many mechanisms, all working, none polished — because which ones need polishing is your call.</text><text x="70" y="142" font-size="11.5" fill="#9AA5B1" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >CAPABILITY</text><text x="466" y="142" font-size="11.5" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >PROOF-OF-CONCEPT BAR</text><text x="1206" y="142" font-size="11.5" fill="#9AA5B1" text-anchor="end" font-weight="bold" font-family="Calibri, Arial, sans-serif" >PRODUCTION</text><text x="70" y="171" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Car following &amp; lane changing</text><rect x="440" y="158" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="158" width="612.8000000000001" height="17" rx="4" fill="#F0B429" opacity="0.92"/><text x="70" y="198" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Junctions &amp; right of way</text><rect x="440" y="185" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="185" width="474.92" height="17" rx="4" fill="#F0B429" opacity="0.92"/><text x="70" y="225" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Rail</text><rect x="440" y="212" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="212" width="536.1999999999999" height="17" rx="4" fill="#F0B429" opacity="0.92"/><text x="70" y="252" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >External agents</text><rect x="440" y="239" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="239" width="505.56" height="17" rx="4" fill="#F0B429" opacity="0.92"/><text x="70" y="279" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Pedestrian navigation &amp; demand</text><rect x="440" y="266" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="266" width="551.52" height="17" rx="4" fill="#2BB3A3" opacity="0.92"/><text x="70" y="306" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Two-level LOD &amp; liveliness</text><rect x="440" y="293" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="293" width="520.88" height="17" rx="4" fill="#2BB3A3" opacity="0.92"/><text x="70" y="333" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Car ↔ pedestrian coupling</text><rect x="440" y="320" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="320" width="421.3" height="17" rx="4" fill="#2BB3A3" opacity="0.92"/><text x="70" y="360" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Panic evacuation</text><rect x="440" y="347" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="347" width="383.0" height="17" rx="4" fill="#2BB3A3" opacity="0.92"/><text x="70" y="387" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Terrain &amp; 3-D placement</text><rect x="440" y="374" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="374" width="490.24" height="17" rx="4" fill="#9AA5B1" opacity="0.92"/><text x="70" y="414" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Replication &amp; dead reckoning</text><rect x="440" y="401" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="401" width="566.84" height="17" rx="4" fill="#9AA5B1" opacity="0.92"/><text x="70" y="441" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Viewers &amp; IG integration</text><rect x="440" y="428" width="766" height="17" rx="4" fill="#1a222c"/><rect x="440" y="428" width="459.59999999999997" height="17" rx="4" fill="#9AA5B1" opacity="0.92"/><line x1="945.56" y1="152" x2="945.56" y2="455" stroke="#57A773" stroke-width="1.6" stroke-dasharray="5 5" opacity="0.75"/><rect x="70" y="482" width="360" height="168" rx="10" fill="#243040" stroke="#57A773" stroke-width="1.3" opacity="1.0"/><text x="94" y="512" font-size="15" fill="#57A773" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Deliberately uniform</text><text x="94" y="538" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Every mechanism was taken to the</text><text x="94" y="557" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >point where it is proven and honest,</text><text x="94" y="576" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >then stopped. Polishing the wrong</text><text x="94" y="595" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >one is the expensive mistake, and</text><text x="94" y="614" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >we could not yet know which.</text><rect x="450" y="482" width="360" height="168" rx="10" fill="#243040" stroke="#F0B429" stroke-width="1.3" opacity="1.0"/><text x="474" y="512" font-size="15" fill="#F0B429" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Why direction is cheap here</text><text x="474" y="538" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >We own every line — no upstream</text><text x="474" y="557" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >fork to maintain.</text><text x="474" y="576" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The parity gate makes change safe.</text><text x="474" y="595" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >The seams are already public.</text><text x="474" y="614" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >Everything is measured, so we know</text><text x="474" y="633" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >where we actually stand.</text><rect x="830" y="482" width="380" height="168" rx="10" fill="#1e2a34" stroke="#F5F7FA" stroke-width="1.4" opacity="1.0"/><text x="854" y="512" font-size="15" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >What the demo proved</text><text x="854" y="538" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >That the performance is there and the</text><text x="854" y="557" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >mechanisms compose. Not that any</text><text x="854" y="576" font-size="12.5" fill="#9AA5B1" text-anchor="start" font-weight="normal" font-family="Calibri, Arial, sans-serif" >one of them is finished.</text><text x="854" y="608" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >Point at any bar above and it</text><text x="854" y="627" font-size="13" fill="#F5F7FA" text-anchor="start" font-weight="bold" font-family="Calibri, Arial, sans-serif" >becomes production work.</text></svg>